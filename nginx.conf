events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Увеличаваме лимита за качване на файлове (например на 10 мегабайта)
    client_max_body_size 10M;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # 1. Снимките - прокси към .NET бекенда, където се съхраняват файловете
        location /uploads/ {
            proxy_pass http://web_api:8080/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. API-то - прокси към .NET-а
        location /api/ {
            proxy_pass http://web_api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. React - всичко друго отива към React Router-а
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}