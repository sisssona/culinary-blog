version: '3.8'

services:
  # 1. PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: culinary_postgres
    restart: always
    environment:
      POSTGRES_DB: CulinaryBlogDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourSecurePassword123!}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CulinaryBlogDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. .NET 8 Web API
  web_api:
    image: culinaryblog-api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: culinary_api
    restart: always
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=culinary_blog_db;Username=postgres;Password=${POSTGRES_PASSWORD:-Sa12341234.}
      - Jwt__Key=${JWT_KEY:-SuperSecretKeyForJwtAuthentication1234567890!}
      - Jwt__Issuer=CulinaryBlog
      - Jwt__Audience=CulinaryBlogUsers
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      postgres_db:
        condition: service_healthy

  # 3. Frontend + Nginx Proxy
  proxy:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
    container_name: culinary_nginx
    restart: always
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web_api

volumes:
  postgres_data:
  uploads_data: