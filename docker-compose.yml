services:
  # 1. PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: culinary_postgres
    restart: always
    environment:
      POSTGRES_DB: culinary_blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinary_blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. .NET 8 Web API
  web_api:
    image: culinaryblog-api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: culinary_api
    restart: always
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=culinary_blog_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in the .env file}
      - Jwt__Issuer=CulinaryBlog
      - Jwt__Audience=CulinaryBlogUsers
      - Email__SmtpServer=smtp-relay.brevo.com
      - Email__SmtpPort=587
      - Email__SmtpLogin=${EMAIL_SMTP_LOGIN:?Set EMAIL_SMTP_LOGIN in the .env file}
      - Email__SmtpPassword=${EMAIL_SMTP_PASSWORD:?Set EMAIL_SMTP_PASSWORD in the .env file}
      - Email__SenderEmail=${EMAIL_SENDER_ADDRESS:?Set EMAIL_SENDER_ADDRESS in the .env file}
      - Email__SenderName=${EMAIL_SENDER_NAME:-Delicious Recipes}
      - Frontend__BaseUrl=${FRONTEND_BASE_URL:-http://localhost:5173}
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      postgres_db:
        condition: service_healthy

  # 3. Frontend + Nginx Proxy
  proxy:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
    container_name: culinary_nginx
    restart: always
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - web_api

volumes:
  postgres_data:
  uploads_data:
